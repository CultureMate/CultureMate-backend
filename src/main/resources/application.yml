server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    # 키는 yml에 두지 않고 프로젝트 루트 .env 에서 읽음
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:h2:file:${H2_DB_PATH:./data/cultureevents};AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    # MariaDB용 마이그레이션은 docker 프로필에서만 실행한다. 로컬 H2는 ddl-auto로 관리.
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}
  seoul-api:
    key: ${SEOUL_API_KEY:}
    base-url: http://openapi.seoul.go.kr:8088
    cache-ttl-minutes: ${SEOUL_CACHE_TTL_MINUTES:30}
    page-size: ${SEOUL_PAGE_SIZE:1000}
  openai:
    key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
  kakao:
    rest-key: ${KAKAO_REST_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
    admin-key: ${KAKAO_ADMIN_KEY:}
  places:
    key: ${GOOGLE_PLACES_API_KEY:}
    search-monthly-limit: ${PLACES_SEARCH_MONTHLY_LIMIT:900}
    photo-monthly-limit: ${PLACES_PHOTO_MONTHLY_LIMIT:900}
    detail-monthly-limit: ${PLACES_DETAIL_MONTHLY_LIMIT:900}
    search-per-minute: ${PLACES_SEARCH_PER_MINUTE:20}
    photo-per-minute: ${PLACES_PHOTO_PER_MINUTE:40}
    detail-per-minute: ${PLACES_DETAIL_PER_MINUTE:20}
    search-per-member-daily: ${PLACES_SEARCH_PER_MEMBER_DAILY:20}
    photo-per-member-daily: ${PLACES_PHOTO_PER_MEMBER_DAILY:20}
    detail-per-member-daily: ${PLACES_DETAIL_PER_MEMBER_DAILY:20}
